---
name: Reusable bicep deployment

on:
  workflow_call:
    inputs:
      rg_name:
        required: true
        type: string

jobs:
  deploy-bicep:
    runs-on: ubuntu-latest
    environment: development
    env:
      testSecret: ${{ secrets.TEST_SECRET }}
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI script
        env:
          resource_group: ${{ inputs.rg_name }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create --resource-group $resource_group --parameters ./bicep/parameters/development/main.bicepparam
